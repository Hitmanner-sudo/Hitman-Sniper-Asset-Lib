name: Deploy asset browser to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', 'site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
  # If Pages is still set to "Deploy from a branch", GitHub's own branch build
  # runs on every push and replaces this site. Redeploy right after it finishes.
  # Setting Pages > Source to "GitHub Actions" makes this unnecessary.
  page_build:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Only what the site needs; skips the large ExportedProject folder.
          sparse-checkout: |
            site
            public
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install build tools
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Build file list and thumbnails
        working-directory: site
        run: node build.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
