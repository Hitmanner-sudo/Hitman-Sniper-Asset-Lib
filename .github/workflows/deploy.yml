name: Deploy asset browser to GitHub Pages

on:
  # Every push to main: if Pages still deploys from a branch, GitHub's branch
  # build runs on every push and would otherwise replace this site.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Only what the site needs; skips the large ExportedProject folder.
          sparse-checkout: |
            site
            public
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install build tools
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Build file list and thumbnails
        working-directory: site
        run: node build.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Settings > Pages > Source is "Deploy from a branch", GitHub also
      # publishes the raw branch after each push. Wait until that has gone live,
      # then publish this site on top. With Source set to "GitHub Actions" there
      # is no branch build and this step finishes straight away.
      - name: Wait for GitHub's branch Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")]' || echo '[]')
            if [ "$(echo "$runs" | jq length)" = 0 ]; then
              if [ "$i" -ge 4 ]; then echo "No branch build for this commit."; exit 0; fi
            elif echo "$runs" | jq -e 'all(.status == "completed")' > /dev/null; then
              echo "Branch build finished. Giving it time to go live before replacing it."
              sleep 120; exit 0
            fi
            sleep 15
          done
          echo "Branch build still running after 15 minutes; deploying anyway."
      - id: deployment
        uses: actions/deploy-pages@v4
